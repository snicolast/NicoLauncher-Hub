[package]
name = "nico-inbox"
description = "snicolast's private mailbox for the launcher's ideas, recomp proposals and messages"
version = "0.3.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"
# The notice to the phone (ntfy). Default features: HTTPS with Mozilla's roots.
ureq = { version = "2.12", features = ["json"] }
