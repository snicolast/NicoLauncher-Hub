[package]
name = "hub-core"
description = "NicoLauncher engine: project registry, source install, script runner and news"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
toml = "0.8"
# HTTPS trusts two lists together (lib.rs, tls_config): the certificates Windows
# has (antivirus and company proxies add their own there) and Mozilla's list
# built into the launcher (Windows only fills its list as its own programs need
# a certificate, so a root a website relies on can be missing on some PCs).
# proxy-from-env: honour HTTPS_PROXY.
ureq = { version = "2.12", features = ["proxy-from-env"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
