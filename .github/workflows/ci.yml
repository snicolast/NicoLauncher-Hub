name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests
        timeout-minutes: 15
        run: cargo test -p hub-core --locked
      # The real build kit: downloaded, unpacked and used to build a program
      - name: Build kit test
        timeout-minutes: 15
        run: cargo test -p hub-core --locked -- --ignored builds_with_the_real_kit
      # The app's own tests: every command answers (no lock taken twice)
      - name: App tests
        timeout-minutes: 15
        run: cargo test -p nicolauncher --locked
      - name: Build NicoLauncher.exe
        run: npx --yes @tauri-apps/cli@2 build --no-bundle -- --locked
      # A convenience for trying a build, not a check: the account's artifact
      # storage can be full, and that says nothing about the code
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NicoLauncher-windows
          path: target/release/nicolauncher.exe
          if-no-files-found: error
          retention-days: 5
